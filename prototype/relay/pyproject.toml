[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "longband-opaque-relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "cryptography>=43,<47", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["src", "../poa/src"]
testpaths = ["tests"]
