[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "longband-poa-harness"
version = "0.1.0"
description = "Transport-independent Proof of Agency research harness"
requires-python = ">=3.12"
dependencies = ["cryptography>=43,<47"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
