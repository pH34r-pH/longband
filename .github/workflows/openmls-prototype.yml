name: OpenMLS prototype

on:
  pull_request:
    paths:
      - '.fleet/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/requirements.yml'
      - 'prototype/openmls/**'
      - '.github/workflows/openmls-prototype.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/openmls
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check native Rust environment
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cc --version
          cargo metadata --locked --format-version 1 --no-deps --manifest-path Cargo.toml >/dev/null
      - run: cargo test --locked
        working-directory: prototype/openmls
      - name: Exercise independent Alice/Bob endpoint processes
        run: |
          set -euo pipefail
          cargo build --locked --quiet
          python3 reference_vessel_qualify.py \
            --binary target/debug/longband-openmls-prototype \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/openmls-process-receipt.json" \
            --loopback
          python3 - <<'PY'
          import json, os
          receipt=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"openmls-process-receipt.json")))
          assert receipt["status"] == "passed"
          assert receipt["endpoint_isolation"]["shared_provider_state"] is False
          assert receipt["bob_endpoint_validation"].startswith("OpenMLS process_message")
          PY
      - name: Exercise two-phase endpoint fixture
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- emit-two-phase "$RUNNER_TEMP/openmls-endpoint-state.txt" "$RUNNER_TEMP/openmls-message.hex"
          cp "$RUNNER_TEMP/openmls-message.hex" "$RUNNER_TEMP/openmls-returned.hex"
          cargo run --locked --quiet -- consume-two-phase "$RUNNER_TEMP/openmls-endpoint-state.txt" "$RUNNER_TEMP/openmls-returned.hex"
          rm -f "$RUNNER_TEMP/openmls-endpoint-state.txt" "$RUNNER_TEMP/openmls-message.hex" "$RUNNER_TEMP/openmls-returned.hex"
      - name: Build portable Alpha endpoint fixture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cargo build --locked --release
          cp target/release/longband-openmls-prototype "$RUNNER_TEMP/longband-openmls-prototype"
          sha256sum "$RUNNER_TEMP/longband-openmls-prototype" | cut -d' ' -f1 > "$RUNNER_TEMP/longband-openmls-prototype.sha256"
      - name: Publish portable Alpha endpoint fixture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: longband-openmls-endpoint-fixture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/longband-openmls-prototype
            ${{ runner.temp }}/longband-openmls-prototype.sha256
          if-no-files-found: error
          retention-days: 7
