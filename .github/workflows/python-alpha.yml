name: Python Alpha prototypes

on:
  pull_request:
    paths:
      - '.fleet/**'
      - '.python-version'
      - 'rust-toolchain.toml'
      - '.github/workflows/requirements.yml'
      - 'prototype/poa/**'
      - 'prototype/relay/**'
      - 'deploy/longband-alpha.service'
      - 'scripts/check_service_contract.py'
      - 'scripts/build_offline_package.py'
      - 'scripts/test_build_offline_package.py'
      - '.github/workflows/python-alpha.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  poa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/poa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: prototype/poa/uv.lock
      - name: Check locked PoA environment
        working-directory: prototype/poa
        run: uv sync --locked --extra test
      - name: Run PoA checks
        working-directory: prototype/poa
        run: uv run --no-sync python -m pytest -q

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: prototype/relay/uv.lock
      - name: Check locked relay environment
        working-directory: prototype/relay
        run: uv sync --locked --extra test
      - name: Run relay checks
        working-directory: prototype/relay
        run: uv run --no-sync python -m pytest -q
      - name: Validate deployable service boundary
        run: uv run --no-sync python ../../scripts/check_service_contract.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            prototype/poa/uv.lock
            prototype/relay/uv.lock
      - name: Check locked package environments
        run: |
          uv sync --project prototype/poa --locked --extra test
          uv sync --project prototype/relay --locked --extra test
      - name: Check package boundary tests
        run: uv run --project prototype/relay --no-sync python -m unittest discover -s scripts -p test_build_offline_package.py
      - name: Build and offline-test exact source package
        run: uv run --project prototype/relay --no-sync python scripts/build_offline_package.py --output-dir "$RUNNER_TEMP/longband-package"
      - name: Publish immutable package and per-wheel receipt on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: longband-offline-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/longband-package/longband-${{ github.sha }}-offline.tar.gz
            ${{ runner.temp }}/longband-package/package-receipt.json
          if-no-files-found: error
          retention-days: 7
