name: Python Alpha prototypes

on:
  pull_request:
    paths:
      - 'prototype/poa/**'
      - 'prototype/relay/**'
      - '.github/workflows/python-alpha.yml'
  push:
    branches: [main]
    paths:
      - 'prototype/poa/**'
      - 'prototype/relay/**'
      - '.github/workflows/python-alpha.yml'

permissions:
  contents: read

jobs:
  poa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/poa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prototype/poa/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prototype/relay/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
